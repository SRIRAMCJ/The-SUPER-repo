name: Core Tests

on:
  push:
    branches: [main, 'foundation/**', 'agent/**', 'cli/**', 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-coordination:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: super_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d super_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install PostgreSQL test driver
        run: npm install --no-save --ignore-scripts pg@8.23.1
      - name: Test independent PostgreSQL connections
        env:
          SUPER_TEST_POSTGRES_URL: postgres://postgres:test-only@localhost:5432/super_test
        run: node --test --test-concurrency=1 packages/runtime/test/postgres-coordination.test.js packages/runtime/test/postgres-worker-stores.test.js packages/runtime/test/postgres-worker-crash.test.js
      - name: Measure PostgreSQL governed TLS dispatch
        env:
          SUPER_TEST_POSTGRES_URL: postgres://postgres:test-only@localhost:5432/super_test
        run: node scripts/benchmark-phase4.mjs 20
      - name: Measure PostgreSQL TLS contention at eight clients
        env:
          SUPER_TEST_POSTGRES_URL: postgres://postgres:test-only@localhost:5432/super_test
        run: node scripts/benchmark-phase4.mjs 200 8
      - name: Repeat PostgreSQL TLS load trials
        env:
          SUPER_TEST_POSTGRES_URL: postgres://postgres:test-only@localhost:5432/super_test
        run: node scripts/benchmark-phase4-repeated.mjs 5 200 8
      - name: Compare audit append methods in paired trials
        env:
          SUPER_TEST_POSTGRES_URL: postgres://postgres:test-only@localhost:5432/super_test
        run: node scripts/benchmark-phase4-paired.mjs 5 100
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run core tests
        run: npm run test:core
      - name: Run runtime tests
        run: npm run test:runtime
      - name: Run repository analyst tests
        run: npm run test:repository-analyst
      - name: Run reverse engineering tests
        run: npm run test:reverse-engineering
      - name: Run CLI tests
        run: npm run test:cli
      - name: Measure Phase 4 local dispatch overhead
        run: node scripts/benchmark-phase4.mjs 20
      - name: Measure SQLite coordination slice
        run: node scripts/benchmark-sqlite-coordination.mjs 100

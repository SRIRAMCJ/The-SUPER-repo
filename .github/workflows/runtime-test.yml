name: Core Tests

on:
  push:
    branches: [main, 'foundation/**', 'agent/**', 'cli/**', 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Typecheck TS and TSX
        run: npm run typecheck
      - name: Test investigation viewer
        run: npm run test:viewer
      - name: Run reverse engineering tests
        run: npm run test:reverse-engineering
      - name: Run core tests
        run: npm run test:core
      - name: Run runtime tests
        run: npm run test:runtime
      - name: Run repository analyst tests
        run: npm run test:repository-analyst
      - name: Run CLI tests
        run: npm run test:cli

name: Core Tests

on:
  push:
    branches: [main, 'foundation/**', 'agent/**', 'cli/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main, 'foundation/**', 'agent/**', 'cli/**', 'feat/**', 'fix/**']

concurrency:
  group: runtime-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run core tests
        run: npm run test:core
      - name: Run sandbox and ToolRuntime regression tests
        run: node --test --test-concurrency=1 --test-timeout=10000 packages/runtime/test/sandbox.test.js packages/runtime/test/tool-runtime.test.js
      - name: Run repository analyst tests
        run: npm run test:repository-analyst
      - name: Run CLI tests
        run: npm run test:cli

  runtime-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Isolate runtime test files
        shell: bash
        run: |
          set +e
          failures=0
          for file in packages/runtime/test/*.test.js; do
            echo "=== START $file ==="
            timeout 10s node --test --test-concurrency=1 --test-force-exit "$file"
            status=$?
            if [ "$status" -eq 124 ]; then
              echo "=== HANG $file status=$status ==="
              exit 124
            elif [ "$status" -ne 0 ]; then
              echo "=== FAIL $file status=$status; continuing ==="
              failures=$((failures + 1))
            else
              echo "=== PASS $file ==="
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "=== RUNTIME DIAGNOSTIC FAILED: $failures test file(s) failed ==="
            exit "$failures"
          fi
          echo "=== RUNTIME DIAGNOSTIC PASSED: all runtime test files passed ==="

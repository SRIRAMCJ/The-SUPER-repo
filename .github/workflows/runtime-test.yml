name: Runtime Tests

on:
  push:
    branches: [main, 'foundation/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run runtime tests
        run: npm run test:runtime

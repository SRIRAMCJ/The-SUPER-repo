name: Core Tests

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Core tests
        run: npm run test:core
      - name: Runtime tests
        run: npm run test:runtime -- --test-timeout=10000
      - name: Repository analyst tests
        run: npm run test:repository-analyst
      - name: CLI tests
        run: npm run test:cli

  sandbox-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Sandbox tests
        run: node --test --test-timeout=5000 packages/runtime/test/sandbox.test.js
